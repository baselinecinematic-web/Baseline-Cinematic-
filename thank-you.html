    <style>
        body { 
            background-color: #121212; 
            color: #f5f5f5; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;

        }
        .container {
            background: #1e1e1e;

            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.8s ease-out forwards;

            transform: translateY(20px);

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            color: #d4af37;
            margin-top: 0;

        }
        p {

            color: #ccc;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .btn {
            font-family: 'Montserrat', sans-serif;
            background: #d4af37;
            color: #000;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2rem;
            transition: background 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .btn:hover {
            background: #b5952f;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
