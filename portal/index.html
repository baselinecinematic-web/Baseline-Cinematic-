document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.prep && LIVE && MODE === 'client') { clientDo('prep', { id:el.dataset.prep, done:el.checked }); return; }
  if (el.dataset.prep) {
    const p = clientProject(), item = p.prep.find(i => i.id === el.dataset.prep);
    if (item) { item.done = el.checked; if (p.prep.every(i => i.done)) { log(p, 'Finished the prep list', 'client'); toast('Prep list finished. You’re ready for shoot day.'); } }
    save(); renderMain(); return;
  }
  if (el.dataset.field) {
    const p = byId(el.dataset.id), f = el.dataset.field; if (!p) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'shootAt' || f === 'proofDueAt') { if (!v) return; v = new Date(v).toISOString(); }
    if (f === 'nextShootAt') v = v ? new Date(v).toISOString() : null;
    if (f === 'reelsPromised') { v = Math.max(1, Math.round(Number(v) || 1)); if (p.reelsDelivered > v) p.reelsDelivered = v; }
    if (f === 'paid') snapshot();
    if (f === 'total') { v = Math.max(0, Number(v) || 0); if (p.paid > v) p.paid = v; }
    if (f === 'paid') { v = Math.min(p.total, Math.max(0, Number(v) || 0)); }
    if (typeof v === 'string') v = v.trim();
    if (f.startsWith('access.')) p.access[f.slice(7)] = v; else p[f] = v;
    if (f === 'paid') log(p, `Paid amount set to ${money(v)} of ${money(p.total)}`);
    save(); renderMain();
    if (f === 'title') { const t = document.querySelector('.sheet-title'); if (t) t.textContent = v; }
    if (f === 'total' || f === 'paid') { renderSheet(); toast(`Saved. ${balance(p) ? money(balance(p)) + ' still owed.' : 'Paid in full.'}`, f === 'paid'); return; }
    if (f === 'reelsPromised' || f === 'weather' || f === 'address') renderSheet();
    toast('Saved.'); return;
  }
  if (el.id === 'drop-input') { const p = byId(el.dataset.id); if (p && el.files.length) addFiles(p, el.files); el.value = ''; return; }
  if (el.dataset.fileName) {
    const p = byId(el.dataset.id), fl = p && p.files.find(k => k.id === el.dataset.fileName);
    if (fl && el.value.trim()) { fl.name = el.value.trim(); save(); toast('File renamed.'); }
    return;
  }
  if (el.dataset.file) {
    const p = byId(el.dataset.id), fl = p && p.files.find(k => k.id === el.dataset.file);
    if (fl) { fl.url = el.value.trim(); save(); renderSheet(); toast(fl.url ? 'Download link saved.' : 'Download link removed.'); }
    return;
  }
  if (el.dataset.crew) {
    const p = byId(el.dataset.id); if (!p) return;
    p.crew[el.dataset.crew] = el.checked; save(); renderModal(false); return;
  }
  if (el.id === 'review-url') { settings.reviewUrl = el.value.trim(); save(); toast('Review link saved.'); return; }
  if (el.id === 'np-client') {
    const c = clientList().find(k => k.name.toLowerCase() === el.value.trim().toLowerCase());
    if (c) { if (!$('np-phone').value) $('np-phone').value = c.phone || ''; if (!$('np-email').value) $('np-email').value = c.email || ''; toast(`Filled in ${c.name}'s details.`); }
    return;
  }
  if (el.id === 'preview-select') { stopPlay(); P.t = 0; state.clientId = el.value; state.confirm = null; renderMain(); return; }
  if (el.name === 'np-service') { $('np-package').innerHTML = pkgOptions(el.value); syncPrice(); return; }
  if (el.id === 'np-package') { syncPrice(); return; }
});
function syncPrice() { const k = PACKAGES.find(x => x.id === $('np-package').value); if (k && k.price !== null) $('np-total').value = k.price; else if (k) { $('np-total').value = ''; $('np-total').focus(); } }

document.addEventListener('input', e => {
  if (e.target.id === 'search') { state.query = e.target.value; $('board').innerHTML = boardHTML(); }
  if (e.target.id === 'client-search') { state.query = e.target.value; const pos = e.target.selectionStart; renderMain(); const i = $('client-search'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'login') {
    const email = $('li-email').value.trim(), pass = $('li-pass').value, msg = $('li-msg');
    if (!pass) { msg.textContent = 'Enter your password, or use the sign-in link button.'; return; }
    msg.textContent = 'Signing in…';
    sb.auth.signInWithPassword({ email, password:pass }).then(({ error }) => { if (error) msg.textContent = error.message === 'Invalid login credentials' ? 'That email and password don’t match. Try again, or email yourself a sign-in link.' : error.message; });
    return;
  }
  if (LIVE && MODE === 'client') {
    if (kind === 'access') clientDo('access', { method:$('ca-method').value, code:$('ca-code').value.trim(), notes:$('ca-notes').value.trim() }, 'Access details saved. Michael and Judith can see them now.');
    if (kind === 'note') {
      const p = clientProject(), c = cutOf(p), text = $('note-text').value.trim(); if (!text || !c) return;
      const tag = (form.querySelector('input[name="tag"]:checked') || {}).value || 'General', t = Math.round(P.t);
      clientDo('note', { cutId:c.id, t, tag, text, tc:tc(t) }, `Note pinned at ${tc(t)}.`).then(ok => { const i = $('note-text'); if (i) i.focus({ preventScroll:true }); });
    }
    if (kind === 'reschedule') {
      const v = $('rs-date').value; if (!v) return; const iso = new Date(v).toISOString();
      clientDo('reschedule', { preferred:iso, note:$('rs-note').value.trim(), label:fmtWhen(iso) }, 'Request sent. Michael and Judith will confirm the new time.').then(ok => { if (ok) { state.modal = null; renderModal(); } });
    }
    return;
  }
  if (kind === 'access') {
    const p = clientProject();
    p.access.method = $('ca-method').value; p.access.code = $('ca-code').value.trim(); p.access.notes = $('ca-notes').value.trim();
    log(p, 'Updated access details', 'client'); save(); renderMain(); toast('Access details saved. Michael and Judith can see them now.');
  }
  if (kind === 'note') {
    const p = clientProject(), c = cutOf(p), text = $('note-text').value.trim(); if (!text || !c) return;
    const tag = (form.querySelector('input[name="tag"]:checked') || {}).value || 'General';
    const t = Math.round(P.t);
    p.notes.push({ id: uid(), cutId: c.id, t, tag, text, resolved:false, at:new Date().toISOString() });
    log(p, `Pinned a note at ${tc(t)}`, 'client'); save(); renderMain(); toast(`Note pinned at ${tc(t)}.`);
    const inp = $('note-text'); if (inp) inp.focus({ preventScroll:true });
  }
  if (kind === 'cut') {
    const p = byId(form.dataset.id);
    const c = { id: uid(), name: $('cut-name').value.trim() || `V${p.cuts.length + 1}`, label: $('cut-label').value.trim() || (p.cuts.length ? 'Notes applied' : 'First cut'), url: $('cut-url').value.trim(), duration: Math.max(5, parseLen($('cut-len').value)) };
    p.cuts.push(c); p.activeCut = c.id;
    log(p, `Posted ${c.name} for review`);
    if (p.stage !== 4) { p.stage = 4; log(p, 'Moved to Review'); }
    refresh(); toast(`${c.name} posted. ${first(p.clientName)} can watch it now.`);
  }
  if (kind === 'payment') {
    const p = byId(form.dataset.id), amt = Math.min(balance(p), Math.max(0, Number($('pay-amt').value) || 0));
    if (!amt) { toast('Enter the amount you received.'); return; }
    snapshot(); p.paid = Math.round((p.paid + amt) * 100) / 100;
    log(p, `Payment of ${money(amt)} received`);
    refresh(); toast(`${money(amt)} recorded. ${balance(p) ? money(balance(p)) + ' still owed.' : 'Paid in full. Downloads are unlocked.'}`, true);
  }
  if (kind === 'prep-add') {
    const p = byId(form.dataset.id), t = $('prep-new').value.trim(); if (!p || !t) return;
    p.prep.push({ id:'x' + uid(), g:'Just for this shoot', text:t, tip:'', done:false });
    log(p, `Added a prep item: ${t}`); refresh(); toast('Added to the client\u2019s prep list.');
    const i = $('prep-new'); if (i) i.focus({ preventScroll:true });
  }
  if (kind === 'reschedule') {
    const p = byId(state.modal.id), v = $('rs-date').value; if (!p || !v) return;
    p.reschedule = { preferred:new Date(v).toISOString(), note:$('rs-note').value.trim(), at:new Date().toISOString(), status:'open' };
    log(p, `Asked to reschedule to ${fmtWhen(p.reschedule.preferred)}`, 'client');
    state.modal = null; renderModal(); save(); renderMain(); toast('Request sent. Michael and Judith will confirm the new time.');
  }
  if (kind === 'lead') {
    leads.unshift({ id:uid(), name:$('ld-name').value.trim(), email:$('ld-email').value.trim(), phone:$('ld-phone').value.trim(), service:$('ld-service').value, project:$('ld-project').value.trim(), message:$('ld-msg').value.trim(), at:new Date().toISOString() });
    state.modal = null; renderModal(); save(); renderMain(); toast('Lead saved.');
  }
  if (kind === 'file') {
    const p = byId(form.dataset.id);
    p.files.push({ id: uid(), name: $('file-name').value.trim(), size: $('file-size').value.trim(), detail: $('file-detail').value.trim(), url:'' });
    refresh(); toast('File added.');
  }
  if (kind === 'new') {
    const service = form.querySelector('input[name="np-service"]:checked').value;
    const pkg = PACKAGES.find(k => k.id === $('np-package').value);
    const total = Math.max(0, Number($('np-total').value) || 0);
    const paidSel = $('np-paid').value;
    const shoot = new Date($('np-date').value);
    const p = {
      id: uid(), token: newToken(), service, packageName: pkg.id === 'portfolio' ? 'Portfolio shoot' : pkg.name,
      title: $('np-title').value.trim(), clientName: $('np-client').value.trim(), clientEmail: $('np-email').value.trim(), clientPhone: $('np-phone').value.trim(),
      total, paid: paidSel === 'full' ? total : paidSel === 'half' ? Math.round(total / 2) : 0,
      stage: 1, shootAt: shoot.toISOString(), proofDueAt: new Date(+shoot + 24 * 36e5).toISOString(),
      airspace: SERVICES[service].drone ? 'pending' : 'not_needed', requirePayment: true, payUrl: '', approvedAt: null,
      access: { method: service === 'real_estate' ? 'Lockbox' : 'Someone on site', code: '', notes: '' },
      prep: defaultPrep(service, pkg.id), files: LIVE ? [] : defaultFiles(service), cuts: [], activeCut: null, notes: [],
      activity: [], createdAt: new Date().toISOString()
    };
    log(p, 'Shoot booked');
    const leadId = state.modal && state.modal.prefill && state.modal.prefill.leadId; if (leadId) leads = leads.filter(k => k.id !== leadId);
    normalize(p); projects.unshift(p); state.modal = null; renderModal(); save(); renderMain(); openSheet(p.id);
    toast('Project created. Send the client their link when you’re ready.');
  }
});

document.addEventListener('mouseover', e => {
  const seg = e.target.closest('[data-tip]'), tip = $('tip');
  if (!seg) { tip.hidden = true; return; }
  tip.textContent = seg.dataset.tip; tip.hidden = false;
  const r = seg.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px'; tip.style.top = (r.top - tip.offsetHeight - 8) + 'px';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.modal) { state.modal = null; renderModal(); }
  else if (state.sheet) closeSheet();
});

function readHash() {
  const h = location.hash.slice(1);
  if (h === 'client') state.view = 'client';
  else if (VIEWS[h]) { state.view = 'studio'; state.tab = h; }
}
window.addEventListener('hashchange', () => { if (MODE === 'client' || (LIVE && !cloud.ready)) return; readHash(); renderMain(); });
async function startStudio() {
  if (!cloud.session) { cloud.ready = false; renderChrome(); $('main').innerHTML = viewLogin(); return; }
  showMessage('Loading your projects', 'One moment.');
  try {
    const ok = await sb.rpc('is_studio');
    if (ok.error) throw ok.error;
    if (!ok.data) { showMessage('This account isn’t on the studio list', `Signed in as ${esc(cloud.session.user.email)}. Add this email to the studio_members table in Supabase, or <button class="link" data-act="sign-out">sign out</button>.`); return; }
    await cloudLoad();
  } catch (e) { console.error(e); showMessage('Couldn’t reach the database', 'Check your connection, then reload the page. If it keeps happening, check that setup.sql ran in Supabase.'); return; }
  cloud.ready = true; render(); setSync('saved'); subscribe();
}
async function boot() {
  if (!LIVE) {
    load();
    if (MODE === 'client') {
      const p = projects.find(x => x.token === CLIENT_TOKEN);
      if (!p) { document.body.classList.add('client-mode'); renderChrome(); showMessage('Project not found', 'Check the link you were sent, or call us at (309) 863-5181.'); return; }
      state.view = 'client'; state.clientId = p.id; document.body.classList.add('client-mode');
    } else readHash();
    render(); return;
  }
  if (MODE === 'client') {
    document.body.classList.add('client-mode'); state.view = 'client'; renderChrome();
    showMessage('Loading your project', 'One moment.');
    const { data, error } = await sb.rpc('get_client_project', { p_token:CLIENT_TOKEN });
    if (error || !data) { showMessage('Project not found', 'Check the link you were sent, or call us at (309) 863-5181 or text (309) 863-5089.'); return; }
    setClientData(data); render();
    setInterval(clientRefresh, 60000);
    document.addEventListener('visibilitychange', clientRefresh);
    return;
  }
  document.body.classList.add('live');
  readHash();
  const { data } = await sb.auth.getSession(); cloud.session = data.session;
  sb.auth.onAuthStateChange((ev, session) => {
    const was = cloud.session && cloud.session.user.id, now = session && session.user.id;
    cloud.session = session; if (was !== now) startStudio();
  });
  startStudio();
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !cloud.ready || pending() || Date.now() - cloud.loadedAt < 120000) return;
    try { await cloudLoad(); renderMain(); if (state.sheet) renderSheet(); } catch (e) {}
  });
  window.addEventListener('beforeunload', e => { if (pending()) { flush(); e.preventDefault(); e.returnValue = ''; } });
}
boot();
</script>
</body>
</html>
