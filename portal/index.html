<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseline Cinematic Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a quiet charcoal studio. The client's project lives on one satin-gold cinema ticket, the only bright surface in the app. */
  --bg:#131519;
  --panel:#1B1E24;
  --panel-2:#23272E;
  --line:rgba(223,200,150,.12);
  --line-strong:rgba(223,200,150,.26);
  --text:#F5F2EB;
  --muted:#A9A496;
  --faint:#7A766D;
  --gold:#D4AF37;
  --satin:#DFC896;
  --ink:#17181B;
  --ok:#86C095;
  --warn:#E6AE5C;
  --alert:#E58370;
  --info:#93B6DC;
  --display:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --metal:linear-gradient(180deg,#EDD27A 0%,#D4AF37 52%,#B48F2A 100%);
  --satin-fill:linear-gradient(128deg,#EADBB0 0%,#DFC896 34%,#CDB27A 68%,#E6D3A0 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--satin)}
:focus-visible{outline:2px solid var(--satin);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(19,21,25,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;height:62px;padding:0 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;color:var(--text)}
.brand svg{width:34px;height:34px;flex:none}
.wordmark{font-family:var(--display);font-weight:500;font-size:14.5px;letter-spacing:.16em;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--text);background:var(--panel-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--satin);color:var(--ink)}

/* ---------- buttons, pills, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;font-weight:600;font-size:14px;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn svg{width:16px;height:16px}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-gold{background:var(--metal);color:var(--ink);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn-gold:hover{background:var(--metal);filter:brightness(1.06)}
.btn-ink{background:var(--ink);color:var(--satin);border:0}
.btn-ink:hover{background:#26282d}
.btn-quiet{border-color:transparent;color:var(--muted)}
.btn-danger{border-color:rgba(229,131,112,.45);color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--satin);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text)}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:rgba(169,164,150,.12);color:var(--muted)}
.pill.ok{background:rgba(134,192,149,.13);color:var(--ok)}
.pill.warn{background:rgba(230,174,92,.13);color:var(--warn)}
.pill.alert{background:rgba(229,131,112,.14);color:var(--alert)}
.pill.info{background:rgba(147,182,220,.13);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));display:inline-block;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.input{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;color:var(--text);font-size:14px}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none;border-color:var(--satin)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
input[type="checkbox"],input[type="radio"]{accent-color:var(--gold)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:30px 24px 96px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.h2{font-size:15.5px;font-weight:700}
.h3{font-size:14.5px;font-weight:700}
.display{font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- studio: today ---------- */
.today-head{margin-bottom:22px}
.today-head h1{font-size:clamp(28px,4vw,40px);line-height:1.12}
.lede{color:var(--muted);margin-top:8px;font-size:15.5px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px;background:var(--panel)}
.strip-seg{background:none;border:0;border-right:1px solid var(--line);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.strip-seg:last-child{border-right:0}
.strip-seg:hover{background:var(--panel-2)}
.strip-seg::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--gold);opacity:var(--o,0)}
.strip-n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.strip-l{font-size:13px;color:var(--muted)}
.today-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);position:relative}
.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--sev)}
.sev-alert{--sev:var(--alert)} .sev-warn{--sev:var(--warn)} .sev-info{--sev:var(--info)}
.task-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.task-t{font-weight:600;font-size:14.5px}
.task-d{color:var(--muted);font-size:13.5px}
.up{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0;padding-top:0}
.cal{width:48px;flex:none;text-align:center;border:1px solid var(--line-strong);border-radius:10px;padding:5px 0 6px;line-height:1.1}
.cal-m{font-size:12px;color:var(--muted)}
.cal-d{font-family:var(--display);font-size:22px;font-weight:600}
.up-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.up-title{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:14.5px}
.up-title:hover{color:var(--satin)}
.up-meta{color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.money-mini{display:flex;align-items:center;justify-content:space-between;gap:12px}
.money-mini strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.acts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.acts li:first-child{border-top:0;padding-top:0}
.acts .when{color:var(--faint);white-space:nowrap}
.foot-tools{margin-top:28px;display:flex;gap:10px;align-items:center;color:var(--faint);font-size:13px}

/* ---------- studio: projects ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:none;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--satin);color:var(--ink);border-color:var(--satin)}
.toolbar .seg{margin-left:auto}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;min-width:1080px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px;font-size:13.5px;font-weight:600}
.col-head span{color:var(--faint);font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:10px}
.col-empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--faint);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--line-strong);background:#1e2128}
.card-k{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.card-t{font-weight:600;font-size:14.5px;line-height:1.35}
.card-c{font-size:13px;color:var(--muted)}
.card-hint{font-size:13px;color:var(--hc,var(--muted))}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:8px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--panel-2)}

/* ---------- studio: payments ---------- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.fig{padding:18px 20px}
.fig strong{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.bill{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.bill:first-of-type{border-top:0;padding-top:0}
.bill-main{flex:1;min-width:0}
.bill-amt{text-align:right;font-variant-numeric:tabular-nums}
.bill-amt strong{display:block;font-size:17px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,9,11,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#17191E;border-left:1px solid var(--line-strong);z-index:41;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet-head{position:sticky;top:0;z-index:2;background:#17191E;display:flex;justify-content:space-between;gap:14px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.sheet-k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.sheet-title{font-family:var(--display);font-size:26px;font-weight:500;line-height:1.15;margin:4px 0 2px}
.sb{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sb:last-child{border-bottom:0}
.sb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.stepper::before{content:"";position:absolute;top:8px;left:10%;right:10%;height:2px;background:var(--line-strong)}
.step{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--faint)}
.step-dot{width:18px;height:18px;border-radius:50%;background:#17191E;border:2px solid var(--line-strong);position:relative;z-index:1}
.step.done{color:var(--muted)}
.step.done .step-dot{background:var(--gold);border-color:var(--gold)}
.step.now{color:var(--text);font-weight:600}
.step.now .step-dot{border-color:var(--satin);box-shadow:0 0 0 4px rgba(223,200,150,.16)}
.step:hover .step-dot{border-color:var(--satin)}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:500 13px/1.4 var(--body);color:var(--satin)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.code-wrap{display:flex;gap:6px}
.code-wrap input{flex:1;min-width:0}
.mini-list li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:3px 0;color:var(--muted)}
.mini-list li.is-done{color:var(--faint);text-decoration:line-through}
.mini-list svg{width:15px;height:15px;flex:none;margin-top:3px}
.cut-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.anote{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.anote:first-child{border-top:0}
.anote.res .anote-text{color:var(--faint);text-decoration:line-through}
.tcode{font-weight:700;font-variant-numeric:tabular-nums;color:var(--satin);min-width:38px}
.subform{border:1px dashed var(--line-strong);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.file-a{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.file-a:first-child{border-top:0}
.file-a-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.fname{font-weight:600;padding:6px 9px}
.pill svg{width:13px;height:13px;flex:none}
.file-a.needs-link input[data-file]{border-color:rgba(230,174,92,.5)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:18px 14px;border:1.5px dashed var(--line-strong);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--satin);background:rgba(223,200,150,.06)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upl{display:flex;flex-direction:column;gap:6px}
.drop-t{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.drop-t svg{width:17px;height:17px;color:var(--satin)}
.sum{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sum strong{font-size:20px;font-variant-numeric:tabular-nums}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text)}
.check-row input{margin-top:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:6vh 16px;background:rgba(8,9,11,.66);overflow-y:auto}
.modal[hidden]{display:none}
.modal-card{width:min(560px,100%);background:#1A1C21;border:1px solid var(--line-strong);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal-head{display:flex;justify-content:space-between;gap:12px}
.modal-head h2{font-family:var(--display);font-weight:500;font-size:26px}
.svc-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.svc-pick label{display:flex;flex-direction:column;gap:6px;padding:11px;border:1px solid var(--line-strong);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer}
.svc-pick input{position:absolute;opacity:0;pointer-events:none}
.svc-pick label:has(input:checked){border-color:var(--satin);background:rgba(223,200,150,.08)}
.svc-pick label:has(input:focus-visible){outline:2px solid var(--satin);outline-offset:2px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.msg-text{min-height:130px}

/* ---------- client view ---------- */
.client{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.preview-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:9px 12px;border:1px dashed var(--line-strong);border-radius:11px}
.preview-bar select{width:auto;max-width:100%;padding:6px 9px;font-size:13px}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 200px;color:var(--ink);border-radius:18px;background-image:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.42) 50%,transparent 60%),var(--satin-fill);background-size:260% 100%,100% 100%;background-position:160% 0,0 0;background-repeat:no-repeat;box-shadow:0 18px 40px -22px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.ticket.sheen{animation:sheen 1.9s .25s cubic-bezier(.3,.6,.2,1) 1 both}
@keyframes sheen{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}
.ticket-main{padding:28px 30px 26px;display:flex;flex-direction:column;gap:6px;min-width:0}
.t-service{font-size:13.5px;font-weight:600;color:rgba(23,24,27,.68)}
.t-title{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4vw,42px);line-height:1.08;letter-spacing:-.015em}
.t-status{font-family:var(--display);font-style:italic;font-size:21px;margin-top:10px}
.t-detail{font-size:15px;color:rgba(23,24,27,.78);max-width:52ch}
.t-steps{display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px;position:relative}
.t-steps::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:rgba(23,24,27,.18)}
.t-steps li{position:relative;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:600;color:rgba(23,24,27,.45)}
.t-steps li::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--ink);transform-origin:left;transform:scaleX(var(--f,0))}
.t-steps li.done{--f:1;color:rgba(23,24,27,.75)}
.t-steps li.now{--f:.5;color:var(--ink)}
.t-dot{width:14px;height:14px;border-radius:50%;background:#D8C189;border:2px solid rgba(23,24,27,.3);position:relative;z-index:1}
.t-steps li.done .t-dot{background:var(--ink);border-color:var(--ink)}
.t-steps li.now .t-dot{background:var(--satin);border-color:var(--ink);box-shadow:0 0 0 4px rgba(23,24,27,.14)}
.ticket-stub{position:relative;border-left:2px dashed rgba(23,24,27,.32);padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.ticket-stub::before{top:-12px}
.ticket-stub::after{bottom:-12px}
.stub-k{font-size:13px;font-weight:600;color:rgba(23,24,27,.6)}
.stub-day{font-family:var(--display);font-size:38px;font-weight:600;line-height:1.05}
.stub-time{font-size:14px;color:rgba(23,24,27,.78)}

.sim::before{top:0} .sim::after{bottom:0}
.sim-cut{position:absolute;top:12%;left:4%;font-size:13px;font-weight:600;color:rgba(245,242,235,.8);z-index:1}

.sim-scene{position:absolute;bottom:13%;left:4%;right:4%;font-family:var(--display);font-style:italic;font-size:clamp(15px,2.2vw,20px);color:rgba(245,242,235,.92);z-index:1}
.big-play{width:64px;height:64px;border-radius:50%;border:0;background:var(--satin);color:var(--ink);display:grid;place-items:center;z-index:1;box-shadow:0 10px 30px -8px rgba(0,0,0,.7)}
.big-play svg{width:24px;height:24px}
.track{position:relative;height:30px;margin:10px 0 2px;cursor:pointer}
.rail{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:4px;background:var(--panel-2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gold)}
.pin{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--ink);background:var(--satin);padding:0}
.pin.res{background:var(--faint)}
.pin:hover{transform:scale(1.2)}
.controls{display:flex;align-items:center;gap:8px}
.tc{margin-left:6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

.note-form{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.tag input:focus-visible+span{outline:2px solid var(--satin);outline-offset:2px}
.notes{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow-y:auto;margin:0 -8px}
.note{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;border-radius:9px;padding:9px 8px;font-size:14px}

.note-body{flex:1;min-width:0}
.note-tag{display:block;font-size:12px;color:var(--faint)}

.approve{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.files{padding:6px 20px}
.file{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file-main{flex:1;min-width:0}
.file-name{font-weight:600;font-size:14.5px}
.file-meta{font-size:13px;color:var(--muted)}

.updates li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.updates li:first-child{border-top:0}

.people{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.contact-lines span{color:var(--muted);font-size:13px}

.login-card{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.login-card h1{font-size:30px}
body.client-mode main{padding-top:24px}
.legal{color:var(--faint);font-size:13px;text-align:center;padding-top:6px}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:#24272D;border:1px solid var(--line-strong);color:var(--text);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.8);transition:opacity .25s,transform .25s}

.cal-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}

.day-item{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}

/* ---------- shoot day ---------- */

.sd-big{font-size:17px;font-weight:600}
.sd-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.crow:first-of-type{border-top:0;padding-top:0}
.crow-main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.crow-name{font-size:16px;font-weight:700}
.crow-projects{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lead{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.lead:first-of-type{border-top:0;padding-top:0}
.lead-main{flex:1;min-width:0}
.lead-q{margin-top:6px;font-size:13px}

.lead-msg{font-size:13.5px;color:var(--muted);margin-top:2px}

.reels{display:flex;align-items:center;gap:10px}
.reels strong{font-size:20px;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}

.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.bars{display:flex;flex-direction:column;gap:12px}

.bar-m{color:var(--muted)}

.bar-seg{background:var(--c);min-width:3px;border-radius:2px;cursor:default}

.bar-seg:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.bar-v{text-align:right;font-variant-numeric:tabular-nums}
.bar-v span{color:var(--faint)}
.tip{position:fixed;z-index:70;pointer-events:none;background:#24272D;border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--text);box-shadow:0 10px 24px -10px rgba(0,0,0,.8);white-space:nowrap}

.tbl-wrap{overflow-x:auto}
.next-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.t-weather{font-size:14px;margin-top:6px;color:rgba(23,24,27,.78)}
.t-weather a{color:var(--ink);font-weight:600}

  .stub-k{width:100%}
  .stub-day{font-size:28px}

  .t-steps li{font-size:11px}
  .next{flex-direction:column;align-items:flex-start}
  .people,.fields,.svc-pick{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}

  .cnav{top:62px}

@media (max-width:440px){

  const d = new Date(iso), now = new Date(), hrs = (d - now) / 36e5;
  const dd = Math.round((dayStart(d) - dayStart(now)) / 864e5);
  if (hrs >= 0 && hrs < 1) return 'within the hour';
  if (hrs > -1 && hrs < 0) return 'within the last hour';
  if (hrs > 0 && hrs < 12) { const h = Math.round(hrs); return `in ${h} hour${s(h)}`; }
  if (hrs < 0 && hrs > -12) { const h = Math.round(-hrs); return `${h} hour${s(h)} ago`; }
  if (dd === 0) return hrs > 0 ? `today at ${fmtTime(iso)}` : 'earlier today';
  if (dd === 1) return `tomorrow at ${fmtTime(iso)}`;
  if (dd === -1) return 'yesterday';
  if (dd > 1 && dd < 7) return `${d.toLocaleDateString('en-US', { weekday:'long' })} at ${fmtTime(iso)}`;
  if (dd >= 7) return `on ${fmtDay(iso)}`;
  return `${-dd} days ago`;
}

const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const cloud = { ready:false, timer:null, busy:false, again:false, saved:{ projects:{}, leads:{}, settings:'' }, session:null, channel:null, loadedAt:0 };
function snapSaved() {
  cloud.saved.projects = Object.fromEntries(projects.map(p => [p.id, canon(p)]));
  cloud.saved.leads = Object.fromEntries(leads.map(l => [l.id, canon(l)]));
  cloud.saved.settings = canon(settings);
}
function setSync(st) { cloud.sync = st; const el = $('sync'); if (el) { el.textContent = st === 'saving' ? 'Saving…' : st === 'error' ? 'Not saved, retrying' : 'All changes saved'; el.className = 'pill ' + (st === 'error' ? 'alert' : st === 'saving' ? '' : 'ok'); } }
async function flush() {
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true;
  const now = new Date().toISOString();
  const curP = {}, upP = [], delP = [], curL = {}, upL = [], delL = [];
  projects.forEach(p => { const j = canon(p); curP[p.id] = j; if (cloud.saved.projects[p.id] !== j) upP.push({ id:p.id, token:p.token, data:p, updated_at:now }); });
  Object.keys(cloud.saved.projects).forEach(id => { if (!(id in curP)) delP.push(id); });
  leads.forEach(l => { const j = canon(l); curL[l.id] = j; if (cloud.saved.leads[l.id] !== j) upL.push({ id:l.id, data:l, updated_at:now }); });
  Object.keys(cloud.saved.leads).forEach(id => { if (!(id in curL)) delL.push(id); });
  const curS = canon(settings);
  try {
    const chk = r => { if (r && r.error) throw r.error; };
    if (upP.length) chk(await sb.from('projects').upsert(upP));
    if (delP.length) chk(await sb.from('projects').delete().in('id', delP));
    if (upL.length) chk(await sb.from('leads').upsert(upL));
    if (delL.length) chk(await sb.from('leads').delete().in('id', delL));
    if (curS !== cloud.saved.settings) chk(await sb.from('settings').upsert({ id:1, data:settings }));
    cloud.saved.projects = curP; cloud.saved.leads = curL; cloud.saved.settings = curS;
    setSync('saved');
  } catch (e) {
    console.error(e); setSync('error');
    if (!cloud.warned) { toast('Changes didn’t reach the cloud. Check your connection. The app keeps retrying.'); cloud.warned = true; }
    setTimeout(save, 5000);
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; flush(); }
  }
}
const pending = () => cloud.busy || cloud.sync === 'saving' || cloud.sync === 'error';
async function cloudLoad() {
  const [pr, ld, st] = await Promise.all([
    sb.from('projects').select('id,data'),
    sb.from('leads').select('id,data'),
    sb.from('settings').select('data').eq('id', 1).maybeSingle()
  ]);
  if (pr.error) throw pr.error;
  projects = pr.data.map(r => normalize(r.data)).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  leads = (ld.data || []).map(r => ({ ...r.data, id:r.id }));
  settings = Object.assign({ reviewUrl:'' }, (st.data && st.data.data) || {});
  snapSaved(); cloud.loadedAt = Date.now();
}
function subscribe() {
  if (cloud.channel) return;
  cloud.channel = sb.channel('studio-sync')
    .on('postgres_changes', { event:'*', schema:'public', table:'projects' }, ev => remoteChange('projects', ev))
    .on('postgres_changes', { event:'*', schema:'public', table:'leads' }, ev => remoteChange('leads', ev))
    .subscribe();
}
function remoteChange(table, ev) {
  const list = table === 'projects' ? projects : leads, saved = cloud.saved[table];
  if (ev.eventType === 'DELETE') {
    const id = ev.old && ev.old.id; if (!id || !saved[id]) return;
    const i = list.findIndex(x => x.id === id); if (i > -1 && canon(list[i]) === saved[id]) list.splice(i, 1);
    delete saved[id];
  } else {
    const row = ev.new; if (!row || !row.data) return;
    const j = canon(table === 'projects' ? normalize({ ...row.data, id:row.id }) : { ...row.data, id:row.id });
    if (saved[row.id] === j) return;
    const i = list.findIndex(x => x.id === row.id);
    if (i > -1 && canon(list[i]) !== saved[row.id]) return; // you have unsaved edits here; yours win
    const item = JSON.parse(j);
    if (i > -1) list[i] = item; else list.unshift(item);
    saved[row.id] = j;
    if (table === 'leads' && i === -1) toast(`New lead from ${item.name || 'your website'}.`);
    if (table === 'projects' && row.data.activity && row.data.activity[0] && row.data.activity[0].who === 'client' && Date.now() - new Date(row.data.activity[0].at) < 60000) toast(`${first(item.clientName)}: ${row.data.activity[0].text}`);
  }
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!typing) { renderMain(); if (state.sheet) renderSheet(); }
}
async function clientDo(action, payload, okMsg) {
  if (!LIVE) return false;
  const { data, error } = await sb.rpc('client_update', { p_token:CLIENT_TOKEN, p_action:action, p_payload:payload });
  if (error || !data) { toast('That didn’t save. Check your connection and try again.'); console.error(error); return false; }
  setClientData(data); renderMain(); if (okMsg) toast(okMsg); return true;
}
function setClientData(data) {
  const keep = projects[0] && projects[0].activeCut;
  const p = normalize(data); if (keep && p.cuts.some(c => c.id === keep)) p.activeCut = keep;
  settings.reviewUrl = data.reviewUrl || ''; delete p.reviewUrl;
  projects = [p]; state.clientId = p.id;
}
async function clientRefresh() {
  if (!LIVE || MODE !== 'client' || document.hidden) return;
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (typing || state.modal || P.playing) return;
  const { data } = await sb.rpc('get_client_project', { p_token:CLIENT_TOKEN });
  if (!data) return;
  const strip = o => { const c = { ...o }; delete c.reviewUrl; delete c.activeCut; return canon(normalize(c)); };
  if (strip(data) !== strip(projects[0])) { setClientData(data); renderMain(); }
}

const state = { view:'studio', tab:'today', sheet:null, clientId:null, filter:'all', query:'', layout:'board', confirm:null, modal:null, sheenDone:{}, showCode:false, calMonth:null, calDay:null };

/* ================= smart logic ================= */
function needs(p) {
  const out = [], now = Date.now(), h = (new Date(p.shootAt) - now) / 36e5, fn = first(p.clientName), sv = SERVICES[p.service];
  const left = p.prep.filter(i => !i.done).length, bal = balance(p);
  if (p.reschedule && p.reschedule.status === 'open') out.push({ sev:'alert', title:`${fn} asked to move ${p.title}`, detail:`Wants ${fmtWhen(p.reschedule.preferred)}${p.reschedule.note ? '. ' + p.reschedule.note : ''}`, act:'accept-resched', label:'Accept new date' });
  if (p.stage <= 2 && sv.drone && p.weather === 'unknown' && h > 0 && h < 48) out.push({ sev:'info', title:`Check the forecast for ${p.title}`, detail:`Shoot ${rel(p.shootAt)}. Mark it so ${fn} sees the weather status.`, act:'weather-ok', label:'Forecast looks good' });
  if (p.service === 'social' && p.nextShootAt) {
    const nh = (new Date(p.nextShootAt) - now) / 36e5;
    const booked = projects.some(o => o !== p && o.service === 'social' && o.clientEmail === p.clientEmail && Math.abs(new Date(o.shootAt) - new Date(p.nextShootAt)) < 4 * 864e5);
    if (!booked && nh < 24 * 5) out.push({ sev: nh < 24 ? 'warn' : 'info', title:`Next retainer shoot for ${fn} ${rel(p.nextShootAt)}`, detail:`${p.title}. Book it so ${fn} gets the prep list.`, act:'duplicate', label:'Book next shoot' });
  }
  if (p.stage === 1) {
    if (h < -3) out.push({ sev:'warn', title:`${p.title} is still marked Booked`, detail:`The shoot was ${rel(p.shootAt)}.`, act:'stage', x:3, label:'Move to Editing' });
    if (!p.access.code.trim() && h < 72 && h > -3) out.push({ sev: h < 36 ? 'alert' : 'warn', title:`No access info for ${p.title}`, detail:`Shoot ${rel(p.shootAt)}. Ask ${fn} how you’re getting in.`, act:'message', label:'Message client' });
    if (sv.drone && p.airspace === 'pending' && h < 96 && h > -3) out.push({ sev: h < 36 ? 'alert' : 'warn', title:'LAANC authorization still pending', detail:`${p.title}, shoot ${rel(p.shootAt)}.`, act:'airspace', label:'Mark cleared' });
    if (left && h > 0 && h < 48) out.push({ sev:'info', title:`${fn} has ${left} prep item${s(left)} left`, detail:`${p.title}, shoot ${rel(p.shootAt)}.`, act:'message', label:'Send reminder' });
    if (p.total > 0 && p.paid === 0 && h < 72) out.push({ sev:'info', title:`No deposit yet from ${fn}`, detail:`${p.title}, ${money(p.total)} booked.`, act:'deposit', label:'Record 50% deposit' });
  }
  if (p.stage === 2) out.push({ sev:'info', title:`On location: ${p.title}`, detail:'Move it to Editing once both cards are backed up.', act:'stage', x:3, label:'Move to Editing' });
  if (p.stage === 3) {
    const due = (new Date(p.proofDueAt) - now) / 36e5;
    if (due < 12) out.push({ sev: due < 0 ? 'alert' : 'warn', title: due < 0 ? `First cut overdue: ${p.title}` : `First cut due ${rel(p.proofDueAt)}`, detail: due < 0 ? `It was promised ${rel(p.proofDueAt)}.` : p.title, act:'open', label:'Post a cut' });
  }
  if (p.stage === 4) {
    const open = p.notes.filter(n => !n.resolved).length;
    if (open) out.push({ sev:'warn', title:`${open} open note${s(open)} from ${fn}`, detail:p.title, act:'open', label:'Review notes' });
  }
  const noLink = p.files.filter(fl => !fl.url).length;
  if (p.stage >= 4 && !p.folderUrl && (noLink || !p.files.length)) out.push({ sev: p.stage === 5 ? 'alert' : 'info', title: p.files.length ? `${noLink} file${s(noLink)} on ${p.title} need${noLink === 1 ? 's' : ''} a download link` : `No files added to ${p.title} yet`, detail: p.stage === 5 ? `${fn} can’t download ${p.files.length ? 'them' : 'anything'} until you add Drive links.` : 'Add them before you deliver, so downloads work the moment it’s approved.', act:'open', label:'Add links' });
  const late = p.stage === 5 && bal > 0 && p.deliveredAt ? daysSince(p.deliveredAt) : 0;
  if (late >= 7) out.push({ sev:'alert', title:`${money(bal)} overdue on ${p.title}`, detail:`Delivered ${late} days ago. A reminder is written and ready to send.`, act:'message', label:'Send reminder' });
  else if (p.stage === 5 && bal > 0) out.push({ sev:'warn', title:`${money(bal)} still due on ${p.title}`, detail: p.requirePayment ? `${fn}’s files stay locked until it’s paid.` : 'Files are already unlocked.', act:'paid', label:'Mark paid' });
  return out.map(t => ({ ...t, pid:p.id }));
}

function hint(p) {
  const h = (new Date(p.shootAt) - Date.now()) / 36e5;
  if (p.stage === 1) {
    if (p.reschedule && p.reschedule.status === 'open') return { text:'Asked to reschedule', c:'var(--alert)' };
    if (!p.access.code.trim() && h < 72) return { text:`Shoot ${rel(p.shootAt)}, no access info`, c:'var(--alert)' };
    return { text:`Shoot ${rel(p.shootAt)}` };
  }
  if (p.stage === 2) return { text:'Filming now' };
  if (p.stage === 3) { const due = (new Date(p.proofDueAt) - Date.now()) / 36e5; return { text:`First cut due ${rel(p.proofDueAt)}`, c: due < 0 ? 'var(--alert)' : due < 12 ? 'var(--warn)' : null }; }
  if (p.stage === 4) { const o = p.notes.filter(n => !n.resolved).length; return o ? { text:`${o} open note${s(o)}`, c:'var(--warn)' } : { text:`Waiting on ${first(p.clientName)}` }; }
  if (p.service === 'social') return { text:`${p.reelsDelivered} of ${p.reelsPromised} reels delivered` };
  if (balance(p) && p.deliveredAt && daysSince(p.deliveredAt) >= 7) return { text:`Balance ${daysSince(p.deliveredAt)} days overdue`, c:'var(--alert)' };
  return { text: p.approvedAt ? `Approved ${fmtDay(p.approvedAt)}` : 'Delivered' };
}

function payPill(p) {
  const b = balance(p);
  if (!p.total) return '<span class="pill">No charge</span>';
  if (!b) return '<span class="pill ok">Paid</span>';
  if (!p.paid) return `<span class="pill alert">${money(b)} unpaid</span>`;
  return `<span class="pill warn">${money(b)} due</span>`;
}

function messageFor(p) {
  const fn = first(p.clientName), link = PORTAL + p.token, bal = balance(p);
  const lines = {
    1: `Hi ${fn}, your Baseline Cinematic shoot is booked for ${fmtWhen(p.shootAt)}. Your project page has a short prep list and a spot for your access details:\n${link}`,
    2: `Hi ${fn}, we're on location today. We'll let you know as soon as editing is underway.\n${link}`,
    3: `Hi ${fn}, your footage is in and editing has started. Expect your first cut ${rel(p.proofDueAt)}.\n${link}`,
    4: `Hi ${fn}, your cut is ready to watch. Leave notes right on the timeline, or approve it when it's right:\n${link}`,
    5: (bal && p.deliveredAt && daysSince(p.deliveredAt) >= 7)
      ? `Hi ${fn}, a friendly reminder that ${money(bal)} is still open for ${p.title}. You can pay and download your files here:\n${link}`
      : `Hi ${fn}, your final files are ready:\n${link}` + (bal && p.requirePayment ? `\nYour remaining balance of ${money(bal)} unlocks the downloads.` : '')
  };
  if (p.reschedule && p.reschedule.status === 'open' && p.stage === 1) return `Hi ${fn}, thanks for letting us know. We can move your shoot to ${fmtWhen(p.reschedule.preferred)}. Your project page has the updated date:\n${link}\n\nMichael & Judith, Baseline Cinematic`;
  return lines[p.stage] + '\n\nMichael & Judith, Baseline Cinematic';
}

function clientNext(p) {
  const left = p.prep.filter(i => !i.done).length, bal = balance(p), cut = cutOf(p);
  if (p.stage === 1) {
    if (p.reschedule && p.reschedule.status === 'open') return { t:'Your reschedule request is in', b:`You asked for ${fmtWhen(p.reschedule.preferred)}. We’ll confirm the new time by text.` };
    if (!p.access.code.trim()) return { t:'Tell us how to get in', b:`We need a code or an on-site contact before ${fmtDay(p.shootAt)}.`, label:'Add access details', go:'c-prep' };
    if (left) return { t:'Finish your prep list', b:`${left} of ${p.prep.length} item${s(p.prep.length)} left. Ten minutes of prep shows up in every shot.`, label:'Open the prep list', go:'c-prep' };
    return { t:'You’re all set', b:`See you ${rel(p.shootAt)}. Nothing else is needed from you.` };
  }
  if (p.stage === 2) return { t:'Nothing needed from you', b:'Your first cut will appear on this page as soon as it’s ready.' };
  if (p.stage === 3) return { t:'Nothing needed from you', b:`Michael is editing and color grading. Expect your first cut ${rel(p.proofDueAt)}.` };
  if (p.stage === 4) return { t:`Watch ${cut ? cut.name : 'your cut'} and tell us what you think`, b:'Pause anywhere to pin a note at that exact moment. When it’s right, approve it.', label:'Watch the cut', go:'c-review' };
  if (bal && p.requirePayment) return { t:`Pay your ${money(bal)} balance`, b:'Your files unlock as soon as it’s paid.', label:'Go to your files', go:'c-files' };
  return { t:'Download your files', b:'Your masters and social cuts are ready.', label:'Go to your files', go:'c-files' };
}

function stageDetail(p) {
  const left = p.prep.filter(i => !i.done).length, bal = balance(p), cut = cutOf(p);
  if (p.stage === 1) return `Shoot ${rel(p.shootAt)}. ${left ? 'Finish your prep list below so we’re ready to roll.' : 'Your prep list is done.'}`;
  if (p.stage === 2) return SERVICES[p.service].drone ? 'We’re on location capturing aerial and ground footage.' : 'We’re on location filming.';
  if (p.stage === 3) return `Footage is in. First cut expected ${rel(p.proofDueAt)}.`;
  if (p.stage === 4) return `${cut ? cut.name + ', ' + cut.label.toLowerCase() + ',' : 'Your cut'} is ready to watch below.`;
  return bal && p.requirePayment ? `Pay the ${money(bal)} balance to unlock your downloads.` : 'Everything is ready to download below.';
}

const TABS = [['today','Today',I.home],['projects','Projects',I.film],['calendar','Calendar',I.today],['clients','Clients',I.users],['payments','Payments',I.wallet]];
const VIEWS = { today:() => viewToday(), projects:() => viewProjects(), calendar:() => viewCalendar(), clients:() => viewClients(), payments:() => viewPayments() };
function renderChrome() {
  const studio = state.view === 'studio';
  document.body.classList.toggle('is-studio', studio);
  $('seg-studio').setAttribute('aria-pressed', studio);
  $('seg-client').setAttribute('aria-pressed', !studio);
  $('btn-new').style.display = studio && (!LIVE || cloud.ready) ? '' : 'none';
  document.querySelector('.top-right .seg').style.display = MODE === 'client' || (LIVE && !cloud.ready) ? 'none' : '';

/* ================= studio: today ================= */
function viewToday() {
  const tasks = projects.flatMap(needs).sort((a, b) => SEV[a.sev] - SEV[b.sev]);
  const active = projects.filter(p => p.stage < 5 || balance(p) > 0).length;
  const upcoming = projects.filter(p => p.stage <= 2 && new Date(p.shootAt) > Date.now() - 6 * 36e5).sort((a, b) => new Date(a.shootAt) - new Date(b.shootAt));
  const openBal = projects.reduce((t, p) => t + balance(p), 0);
  const openCount = projects.filter(p => balance(p) > 0).length;
  const acts = projects.flatMap(p => p.activity.map(a => ({ ...a, p }))).sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 6);
  const today = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  const most = Math.max(1, ...STAGES.map(st => projects.filter(p => p.stage === st.n).length));

  return `
  <section class="today-head">
    <h1 class="display">${greeting()}, Michael &amp; Judith</h1>
    <p class="lede">${today}. ${active} active project${s(active)}, ${tasks.length ? `${tasks.length} thing${s(tasks.length)} need${tasks.length === 1 ? 's' : ''} you.` : 'nothing needs you right now.'}</p>
  </section>

  <nav class="strip" aria-label="Projects by stage">
    ${STAGES.map(st => { const n = projects.filter(p => p.stage === st.n).length; return `<button class="strip-seg" style="--o:${n ? (0.35 + 0.65 * n / most).toFixed(2) : 0}" data-act="tab" data-x="projects"><span class="strip-n">${n}</span><span class="strip-l">${st.label}</span></button>`; }).join('')}
  </nav>

  <div class="today-grid">
    <section class="panel">
      <div class="panel-head"><h2 class="h2">Needs you</h2>${tasks.length ? '<span class="muted small">Most urgent first</span>' : ''}</div>
      ${tasks.length ? `<ul class="tasks">${tasks.map(taskRow).join('')}</ul>` : '<p class="empty">Nothing needs you right now. Every project is moving.</p>'}
    </section>

    <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2 class="h2">New leads${leads.length ? ` <span class="pill info">${leads.length}</span>` : ''}</h2><button class="btn btn-sm" data-act="add-lead">${I.plus}Add lead</button></div>
        ${leads.length ? leads.slice().sort((a, b) => new Date(b.at) - new Date(a.at)).map(leadRow).join('') : '<p class="empty">No open leads. Quote requests from your website will land here once the form is connected.</p>'}
      </section>
      <section class="panel">
        <div class="panel-head"><h2 class="h2">Coming up</h2></div>
        ${upcoming.length ? upcoming.map(upRow).join('') : '<p class="empty">No shoots on the calendar. <button class="link" data-act="new">Book one</button></p>'}
      </section>
      <section class="panel money-mini">
        <div><span class="muted small">Open balances</span><strong>${money(openBal)}</strong><span class="muted small">${openCount} project${s(openCount)}</span></div>
        <button class="btn btn-sm" data-act="tab" data-x="payments">See payments</button>
      </section>
      <section class="panel">
        <div class="panel-head"><h2 class="h2">Recent activity</h2></div>
        <ul class="acts">${acts.map(a => `<li><span>${a.who === 'client' ? esc(first(a.p.clientName)) : 'You'}: ${esc(a.text)} <span class="muted">on ${esc(a.p.title)}</span></span><span class="when">${ago(a.at)}</span></li>`).join('')}</ul>
      </section>
    </div>
  </div>

  ${LIVE ? `<div class="foot-tools"><span id="sync" class="pill ok">All changes saved</span><span>Signed in as ${esc(cloud.session ? cloud.session.user.email : '')}</span><button class="link" data-act="sign-out">Sign out</button></div>` : `<div class="foot-tools">${state.confirm === 'reset'
    ? `<span>Replace everything with the sample projects?</span><button class="btn btn-sm btn-danger" data-act="reset-yes">Reset</button><button class="btn btn-sm btn-quiet" data-act="cancel-confirm">Keep my data</button>`
    : `<span>Sample data is stored in this browser only.</span><button class="link" data-act="reset">Reset sample data</button>`}</div>`}`;
}

function taskRow(t) {
  const p = byId(t.pid);

/* ================= studio: calendar ================= */
function monthStart(d) { const x = new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }
function calEvents() {
  const ev = {};
  const add = (iso, item) => { const k = dayKey(iso); (ev[k] = ev[k] || []).push(item); };
  projects.forEach(p => {
    add(p.shootAt, { p, kind:'shoot', at:p.shootAt });
    if (p.service === 'social' && p.nextShootAt && p.stage === 5) add(p.nextShootAt, { p, kind:'next', at:p.nextShootAt });
  });
  Object.values(ev).forEach(list => list.sort((a, b) => new Date(a.at) - new Date(b.at)));
  return ev;
}
function viewCalendar() {
  const m = state.calMonth ? new Date(state.calMonth) : monthStart(new Date());
  const ev = calEvents(), todayK = dayKey(new Date());
  const start = new Date(m); start.setDate(1 - m.getDay());
  const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = Math.ceil((m.getDay() + days) / 7) * 7;
  const sel = state.calDay || (dayKey(m) === dayKey(monthStart(new Date())) ? todayK : dayKey(m));
  const grid = [];
  for (let i = 0; i < cells; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = dayKey(d), list = ev[k] || [];
    grid.push(`<button class="cal-cell ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${k === todayK ? 'is-today' : ''} ${k === sel ? 'sel' : ''}" data-act="cal-day" data-x="${k}" aria-label="${d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })}, ${list.length} shoot${s(list.length)}">
      <span class="cal-num">${d.getDate()}</span>
      ${list.slice(0, 3).map(e => `<span class="cal-ev"><span class="dot" style="--c:${SERVICES[e.p.service].color}${e.kind === 'next' ? ';opacity:.45' : ''}"></span><span>${fmtTime(e.at).replace(':00', '')} ${esc(e.kind === 'next' ? 'Retainer' : e.p.title.split(',')[0])}</span></span>`).join('')}
      ${list.length > 3 ? `<span class="cal-ev muted">+${list.length - 3} more</span>` : ''}
    </button>`);
  }
  const selList = ev[sel] || [];
  const selDate = new Date(sel + 'T12:00');
  return `
  <div class="cal-layout">
    <section>
      <div class="month-head">
        <h2>${m.toLocaleDateString('en-US', { month:'long', year:'numeric' })}</h2>
        <button class="icon-btn" data-act="cal-move" data-x="-1" aria-label="Previous month">${I.left}</button>
        <button class="btn btn-sm" data-act="cal-today">Today</button>
        <button class="icon-btn" data-act="cal-move" data-x="1" aria-label="Next month">${I.right}</button>
      </div>
      <div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<span class="cal-dow">${d}</span>`).join('')}${grid.join('')}</div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 class="h2">${selDate.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })}</h2></div>
      ${selList.length ? selList.map(e => {
        const p = e.p, sv = SERVICES[p.service];
        if (e.kind === 'next') return `<div class="day-item"><span class="card-k"><span class="dot" style="--c:${sv.color}"></span>Retainer shoot due</span><strong>${esc(p.clientName)}</strong><span class="muted small">${fmtTime(e.at)}, not booked yet</span><div class="row-btns"><button class="btn btn-sm btn-gold" data-act="duplicate" data-id="${p.id}">Book next shoot</button></div></div>`;
        return `<div class="day-item">
          <span class="card-k"><span class="dot" style="--c:${sv.color}"></span>${sv.label}, ${STAGES[p.stage - 1].label}</span>
          <button class="up-title" data-act="open" data-id="${p.id}">${esc(p.title)}</button>
          <span class="muted small">${fmtTime(p.shootAt)} with ${esc(p.clientName)}</span>
          <div class="row-btns">
            ${p.stage <= 2 ? `<button class="btn btn-sm" data-act="shootday" data-id="${p.id}">${I.clap}Shoot-day mode</button>` : ''}
            <a class="btn btn-sm" href="${esc(gcalLink(p, false))}" target="_blank" rel="noopener">${I.today}Add to Google Calendar</a>
          </div>
        </div>`;
      }).join('') : `<p class="empty">No shoots this day. <button class="link" data-act="new" data-x="${sel}">Book one</button></p>`}
    </section>
  </div>`;
}

/* ================= studio: clients ================= */
function clientList() {
  const map = new Map();
  projects.forEach(p => {
    const k = (p.clientEmail || p.clientName || '').toLowerCase().trim(); if (!k) return;
    if (!map.has(k)) map.set(k, { key:k, name:p.clientName, email:p.clientEmail, phone:p.clientPhone, projects:[] });
    const c = map.get(k); c.projects.push(p); if (!c.phone && p.clientPhone) c.phone = p.clientPhone;
  });
  return [...map.values()].map(c => {
    c.projects.sort((a, b) => new Date(b.shootAt) - new Date(a.shootAt));
    c.booked = c.projects.reduce((t, p) => t + (p.total || 0), 0);
    c.owed = c.projects.reduce((t, p) => t + balance(p), 0);
    c.last = c.projects[0];
    return c;
  }).sort((a, b) => new Date(b.last.shootAt) - new Date(a.last.shootAt));
}

function earningsHTML() {
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString('en-US', { month:'short' }), long:d.toLocaleDateString('en-US', { month:'long', year:'numeric' }), by:{}, total:0, paid:0 }); }
  projects.forEach(p => {
    const d = new Date(p.shootAt), mo = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth()); if (!mo) return;
    mo.by[p.service] = (mo.by[p.service] || 0) + (p.total || 0); mo.total += p.total || 0; mo.paid += p.paid || 0;
  });
  const max = Math.max(1, ...months.map(x => x.total));
  const keys = Object.keys(SERVICES);
  const cur = months[months.length - 1], recurring = cur.by.social || 0;
  const rows = keys.map(k => {
    const ps = projects.filter(p => p.service === k && months.some(x => x.y === new Date(p.shootAt).getFullYear() && x.m === new Date(p.shootAt).getMonth()));
    return { k, n:ps.length, booked:ps.reduce((t, p) => t + (p.total || 0), 0), paid:ps.reduce((t, p) => t + (p.paid || 0), 0) };
  });
  return `<section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2 class="h2">Earnings by month</h2><span class="muted small">Booked value by shoot month, last 6 months</span></div>
    <p class="small" style="margin-bottom:14px">This month: ${money(cur.total)} booked, ${money(cur.paid)} collected. Retainers make up ${money(recurring)}${cur.total ? ` (${Math.round(recurring / cur.total * 100)}%)` : ''}.</p>
    <div class="legend">${keys.map(k => `<span><span class="sw" style="--c:${SERVICES[k].color}"></span>${SERVICES[k].label}</span>`).join('')}</div>
    <div class="bars" role="img" aria-label="Booked value by month and service, last six months">
      ${months.map(mo => `<div class="bar-row">
        <span class="bar-m">${mo.label}</span>
        <div class="bar-track ${mo.total ? '' : 'empty'}">${mo.total ? `<div style="display:flex;gap:2px;width:${(mo.total / max * 100).toFixed(1)}%">${keys.filter(k => mo.by[k]).map(k => `<span class="bar-seg" style="--c:${SERVICES[k].color};flex:${mo.by[k]}" data-tip="${esc(mo.long)}: ${SERVICES[k].label} ${money(mo.by[k])}"></span>`).join('')}</div>` : ''}</div>
        <span class="bar-v">${money(mo.total)} <span>/ ${money(mo.paid)} in</span></span>
      </div>`).join('')}
    </div>
    <div class="tbl-wrap" style="margin-top:20px">
      <table class="tbl">
        <thead><tr><th>Service, last 6 months</th><th>Projects</th><th>Booked</th><th>Collected</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td><span class="card-k" style="color:var(--text)"><span class="dot" style="--c:${SERVICES[r.k].color}"></span>${SERVICES[r.k].label}</span></td><td>${r.n}</td><td>${money(r.booked)}</td><td>${money(r.paid)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </section>`;
}

    <div>${p.files.map(fl => `<div class="file-a ${fl.url ? '' : 'needs-link'}"><div class="file-a-top"><input class="input fname" data-file-name="${fl.id}" data-id="${p.id}" value="${esc(fl.name)}" aria-label="File name"><span class="muted small" style="white-space:nowrap">${esc(fl.size)}</span><button class="btn btn-sm btn-quiet" data-act="remove-file" data-id="${p.id}" data-x="${fl.id}" aria-label="Remove ${esc(fl.name)}">${I.x}</button></div>${fl.detail ? `<span class="muted small">${esc(fl.detail)}</span>` : ''}${DRIVE.up[fl.id] ? uploadRow(fl) : `<input class="input" data-file="${fl.id}" data-id="${p.id}" value="${esc(fl.url)}" placeholder="${CONFIG.googleClientId ? 'Drop the file above to upload it, or paste a link' : 'Paste this file\u2019s Google Drive link so the client can download it'}">`}</div>`).join('') || '<p class="empty">No files listed.</p>'}</div>

    ${bal ? `<form class="subform" data-form="payment" data-id="${p.id}">
      <span class="small">Record a payment</span>

  <section class="sb">
    ${state.confirm === 'delete:' + p.id
      ? `<div class="confirm"><span>Delete this project and its client page?</span><button class="btn btn-sm btn-danger" data-act="delete-yes" data-id="${p.id}">Delete project</button><button class="btn btn-sm btn-quiet" data-act="cancel-confirm">Keep it</button></div>`

  </section>`;
}

/* ================= modals ================= */
function renderModal(focus = true) {
  const m = $('modal');
  if (!state.modal) { m.hidden = true; m.innerHTML = ''; return; }
  const t = state.modal.type, p = state.modal.id ? byId(state.modal.id) : null;
  if (state.modal.id && !p) { state.modal = null; m.hidden = true; m.innerHTML = ''; return; }
  const top = m.scrollTop;
  m.hidden = false;
  m.innerHTML = t === 'new' ? newHTML(state.modal.prefill || {}) : t === 'shootday' ? shootDayHTML(p) : t === 'reschedule' ? reschedHTML(p) : t === 'lead' ? leadHTML() : msgHTML(p);
  if (focus) { const firstInput = m.querySelector('input:not([type="radio"]):not([type="checkbox"]),textarea,button'); if (firstInput) setTimeout(() => firstInput.focus({ preventScroll:true }), 30); }
  else m.scrollTop = top;
}

function shootDayHTML(p) {
  const sv = SERVICES[p.service], crew = CREW.filter(c => sv.drone || !c.drone), done = crew.filter((c, i) => p.crew[c.t]).length;
  const code = p.access.code.trim();
  return `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="sd-h">
    <div class="modal-head"><div><p class="sheet-k"><span class="dot" style="--c:${sv.color}"></span>Shoot day, ${fmtTime(p.shootAt)} (${rel(p.shootAt)})</p><h2 id="sd-h">${esc(p.title)}</h2></div><button class="icon-btn" type="button" data-act="close-modal" aria-label="Close">${I.x}</button></div>
    <div class="sd-block">
      <span class="sd-k">Address</span><span class="sd-big">${esc(addrOf(p))}</span>
      <div class="row-btns"><a class="btn btn-gold" href="${esc(GOOGLE.maps(addrOf(p)))}" target="_blank" rel="noopener">${I.nav}Directions</a></div>
    </div>
    <div class="sd-block">
      <div class="sd-row"><span class="sd-k">${esc(p.access.method)}</span>${code ? `<button class="btn btn-sm" data-act="copy-code" data-id="${p.id}">${I.copy}Copy</button>` : ''}</div>
      ${code ? `<span class="sd-code">${esc(code)}</span>` : `<span class="sd-big" style="color:var(--alert)">No code yet</span><div><button class="btn btn-sm" data-act="message" data-id="${p.id}">${I.msg}Ask ${esc(first(p.clientName))}</button></div>`}
      ${p.access.notes ? `<span class="muted">${esc(p.access.notes)}</span>` : ''}
    </div>
    <div class="sd-block">
      <span class="sd-k">Client</span><span class="sd-big">${esc(p.clientName)}</span>
      ${p.clientPhone ? `<div class="contact-lines"><a href="tel:${esc(p.clientPhone.replace(/[^\d+]/g, ''))}">${I.phone}Call ${esc(p.clientPhone)}</a><a href="sms:${esc(p.clientPhone.replace(/[^\d+]/g, ''))}">${I.msg}Text ${esc(p.clientPhone)}</a></div>` : '<span class="muted">No phone on file</span>'}
    </div>
    <div class="sd-row">
      <span class="pills">
        ${sv.drone ? (p.airspace === 'cleared' ? '<span class="pill ok">Airspace cleared</span>' : p.airspace === 'not_needed' ? '<span class="pill">No LAANC needed</span>' : `<span class="pill warn">LAANC pending</span><button class="btn btn-sm" data-act="airspace" data-id="${p.id}">Mark cleared</button>`) : ''}
        <span class="pill ${p.weather === 'good' ? 'ok' : p.weather === 'unknown' ? '' : 'warn'}">${WEATHER[p.weather].label}</span>
        <a class="btn btn-sm btn-quiet" href="${esc(GOOGLE.forecast(addrOf(p)))}" target="_blank" rel="noopener">Forecast${I.ext}</a>
      </span>
    </div>
    <div class="sd-block">
      <div class="sd-row"><span class="sd-k">Crew checklist</span><span class="muted small">${done} of ${crew.length}</span></div>
      <ul class="checks">${crew.map((c, i) => `<li><label class="check ${p.crew[c.t] ? 'is-done' : ''}"><input type="checkbox" data-crew="${esc(c.t)}" data-id="${p.id}" ${p.crew[c.t] ? 'checked' : ''}><span>${esc(c.t)}</span></label></li>`).join('')}</ul>
    </div>
    <div class="modal-foot">
      ${p.stage === 1 ? `<button class="btn" data-act="sd-start" data-id="${p.id}">We’re on site</button>` : ''}
      <button class="btn btn-gold" data-act="sd-wrap" data-id="${p.id}">Wrapped, move to Editing</button>
    </div>
  </div>`;
}

/* ================= player ================= */
const P = { t:0, playing:false, timer:null };
function afterClient() {
  const v = $('pv');
  if (v) {
    v.addEventListener('timeupdate', () => { P.t = v.currentTime; paintPlayer(); });
    v.addEventListener('play', () => { P.playing = true; paintPlay(); });
    v.addEventListener('pause', () => { P.playing = false; paintPlay(); });
    v.addEventListener('loadedmetadata', () => {
      const p = clientProject(), c = cutOf(p);
      if (c && isFinite(v.duration) && Math.round(v.duration) !== c.duration) { c.duration = Math.round(v.duration); save(); renderMain(); }
      else if (P.t) v.currentTime = P.t;
    });
  }
  paintPlayer();
}
function curCut() { const p = clientProject(); return p ? cutOf(p) : null; }
function paintPlayer() {
  const c = curCut(); if (!c || !$('p-tc')) return;
  const pct = Math.min(100, P.t / c.duration * 100);
  $('p-tc').textContent = tc(P.t);
  $('p-fill').style.width = pct + '%';
  if ($('p-add')) $('p-add').textContent = `Pin note at ${tc(P.t)}`;
  if ($('p-scene')) { const sc = SERVICES[clientProject().service].scenes; $('p-scene').textContent = sc[Math.min(sc.length - 1, Math.floor(P.t / c.duration * sc.length))]; }
}
function paintPlay() { ['p-play', 'p-big'].forEach(id => { if ($(id)) $(id).innerHTML = P.playing ? I.pause : I.play; }); }
function seek(t) {
  const c = curCut(); if (!c) return;
  P.t = Math.max(0, Math.min(c.duration, t));
  const v = $('pv'); if (v) { try { v.currentTime = P.t; } catch (e) {} }
  paintPlayer();
}
function togglePlay() {
  const v = $('pv');
  if (v) { v.paused ? v.play().catch(() => toast('This video couldn’t play here. Check the link in Studio.')) : v.pause(); return; }
  if (P.playing) { stopPlay(); return; }
  const c = curCut(); if (!c) return;
  if (P.t >= c.duration) P.t = 0;
  P.playing = true; paintPlay();
  P.timer = setInterval(() => {
    const cc = curCut(); if (!cc || state.view !== 'client') { stopPlay(); return; }
    P.t = Math.min(cc.duration, P.t + 0.25);
    if (P.t >= cc.duration) stopPlay();
    paintPlayer();
  }, 250);
}
function stopPlay() { clearInterval(P.timer); P.timer = null; P.playing = false; const v = $('pv'); if (v && !v.paused) v.pause(); paintPlay(); }

/* ================= drag and drop files ================= */
const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? Math.round(b / 1e6) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const KINDS = { mp4:'MP4 video', mov:'MOV video', m4v:'MP4 video', webm:'WebM video', jpg:'JPEG photo', jpeg:'JPEG photo', png:'PNG image', heic:'HEIC photo', tif:'TIFF photo', tiff:'TIFF photo', dng:'RAW photo', zip:'ZIP folder', pdf:'PDF' };
function niceName(fn) { const n = fn.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim() || fn; return n.charAt(0).toUpperCase() + n.slice(1); }
/* ================= Google Drive uploads ================= */
const DRIVE = { token:null, exp:0, client:null, up:{}, okIds:new Set() };
try { const t = JSON.parse(sessionStorage.getItem('bc_drive') || 'null'); if (t && t.exp > Date.now()) { DRIVE.token = t.token; DRIVE.exp = t.exp; } } catch (e) {}
const driveConnected = () => !!(DRIVE.token && Date.now() < DRIVE.exp - 60000);
function driveConnect(switching) {
  return new Promise((ok, bad) => {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { toast('Google sign-in is still loading. Try again in a moment.'); return bad(new Error('gsi')); }
    if (!DRIVE.client) DRIVE.client = google.accounts.oauth2.initTokenClient({ client_id:CONFIG.googleClientId, scope:'https://www.googleapis.com/auth/drive.file', callback:() => {} });
    DRIVE.client.callback = r => {
      if (r.error) { toast('Google Drive wasn’t connected.'); return bad(r); }
      DRIVE.token = r.access_token; DRIVE.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
      try { sessionStorage.setItem('bc_drive', JSON.stringify({ token:DRIVE.token, exp:DRIVE.exp })); } catch (e) {}
      ok();
    };
    DRIVE.client.error_callback = e => { toast('Google sign-in closed before it finished.'); bad(e); };
    DRIVE.client.requestAccessToken(switching ? { prompt:'select_account' } : { login_hint:CONFIG.driveAccount });
  });
}
async function gdrive(path, opts = {}) {
  const r = await fetch('https://www.googleapis.com/drive/v3/' + path, { ...opts, headers:{ Authorization:'Bearer ' + DRIVE.token, 'Content-Type':'application/json', ...(opts.headers || {}) } });
  if (!r.ok) { const e = new Error('drive ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const shareAnyone = id => gdrive(`files/${id}/permissions`, { method:'POST', body:JSON.stringify({ role:'reader', type:'anyone' }) });
async function liveFolder(id) {
  if (!id) return false; if (DRIVE.okIds.has(id)) return true;
  try { const f = await gdrive(`files/${id}?fields=id,trashed`); if (!f.trashed) { DRIVE.okIds.add(id); return true; } } catch (e) { if (e.status === 401) throw e; }
  return false;
}
async function newFolder(name, parent) {
  const f = await gdrive('files?fields=id', { method:'POST', body:JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder', ...(parent ? { parents:[parent] } : {}) }) });
  DRIVE.okIds.add(f.id); return f.id;
}
async function projectFolder(pid) {
  let p = byId(pid);
  if (await liveFolder(p.driveFolderId)) return p.driveFolderId;
  if (!(await liveFolder(settings.driveRootId))) { settings.driveRootId = await newFolder('Baseline Cinematic Portal'); save(); }
  const id = await newFolder(p.title, settings.driveRootId);
  await shareAnyone(id);
  p = byId(pid); p.driveFolderId = id; p.folderUrl = `https://drive.google.com/drive/folders/${id}`;
  log(p, 'Created the Google Drive folder for this project'); save();
  return id;
}
function uploadRow(fl) {
  const u = DRIVE.up[fl.id];
  if (u.state === 'uploading') return `<div class="upl"><div class="meter" style="margin:0"><span id="upb-${fl.id}" style="width:${u.pct}%"></span></div><span class="muted small" id="upt-${fl.id}">Uploading to Google Drive, ${u.pct}%</span></div>`;
  if (u.state === 'auth') return `<div class="sd-row"><span class="small" style="color:var(--warn)">${driveConnected() ? 'Waiting to upload' : 'Connect Google Drive to upload this file'}</span><button class="btn btn-sm btn-gold" data-act="drive-retry" data-x="${fl.id}">${driveConnected() ? 'Upload now' : 'Connect and upload'}</button></div>`;
  return `<div class="sd-row"><span class="small" style="color:var(--alert)">Upload didn’t finish. ${esc(u.msg || '')}</span><button class="btn btn-sm" data-act="drive-retry" data-x="${fl.id}">Try again</button></div>`;
}
let paintRaf = 0;
function paintUploads() {
  if (paintRaf) return;
  paintRaf = requestAnimationFrame(() => {
    paintRaf = 0;
    Object.entries(DRIVE.up).forEach(([id, u]) => {
      const bar = $('upb-' + id), txt = $('upt-' + id);
      if (u.state === 'uploading' && bar) { bar.style.width = u.pct + '%'; txt.textContent = `Uploading to Google Drive, ${u.pct}%`; }
    });
  });
}
function uploadFile(pid, fid, file) {
  DRIVE.up[fid] = { pct:0, state:'uploading', file, pid };
  if (state.sheet === pid) renderSheet();
  (async () => {
    try {
      if (!driveConnected()) { const e = new Error('auth'); e.status = 401; throw e; }
      const folder = await projectFolder(pid);
      const init = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink', {
        method:'POST',
        headers:{ Authorization:'Bearer ' + DRIVE.token, 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':file.type || 'application/octet-stream', 'X-Upload-Content-Length':String(file.size) },
        body:JSON.stringify({ name:file.name, parents:[folder] })
      });
      if (!init.ok) { const e = new Error('init'); e.status = init.status; throw e; }
      const loc = init.headers.get('Location'); if (!loc) throw new Error('No upload address from Google.');
      const res = await new Promise((ok, bad) => {
        const x = new XMLHttpRequest(); x.open('PUT', loc);
        x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        x.upload.onprogress = e => { if (e.lengthComputable && DRIVE.up[fid]) { DRIVE.up[fid].pct = Math.min(99, Math.round(e.loaded / e.total * 100)); paintUploads(); } };
        x.onload = () => x.status < 300 ? ok(JSON.parse(x.responseText)) : bad(Object.assign(new Error('upload'), { status:x.status }));
        x.onerror = () => bad(new Error('The connection dropped.'));
        x.send(file);
      });
      await shareAnyone(res.id);
      const p = byId(pid), f2 = p && p.files.find(k => k.id === fid);
      if (f2) { f2.url = res.webViewLink || `https://drive.google.com/file/d/${res.id}/view`; f2.driveId = res.id; }
      delete DRIVE.up[fid];
      if (p) { log(p, `Uploaded ${f2 ? f2.name : file.name} to Google Drive`); save(); }
      if (state.sheet === pid) renderSheet(); renderMain();
      toast(`${f2 ? f2.name : file.name} uploaded. Its download link is saved.`);
    } catch (e) {
      console.error(e);
      const u = DRIVE.up[fid]; if (!u) return;
      if (e.status === 401) { DRIVE.token = null; u.state = 'auth'; }
      else { u.state = 'error'; u.msg = e.status === 403 ? 'Google refused it. Check the Drive setup.' : e.status === 404 ? 'The Drive folder is gone. Try again to make a new one.' : (e.message && e.message.length > 12 ? e.message : ''); if (e.status === 404) { const p = byId(pid); if (p) { p.driveFolderId = ''; } } }
      if (state.sheet === pid) renderSheet();
    }
  })();
}
function driveResume(only) {
  Object.entries(DRIVE.up).forEach(([fid, u]) => { if ((!only || only === fid) && u.state !== 'uploading') uploadFile(u.pid, fid, u.file); });
}
window.addEventListener('beforeunload', e => { if (Object.values(DRIVE.up).some(u => u.state === 'uploading')) { e.preventDefault(); e.returnValue = ''; } });

function addFiles(p, list) {
  const added = [];
  [...list].forEach(file => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const match = p.files.find(k => !k.url && k.original === file.name && !DRIVE.up[k.id]);
    const fl = match || { id:uid(), name:niceName(file.name), size:fmtBytes(file.size), detail:KINDS[ext] || (file.type ? file.type.split('/')[0] + ' file' : 'File'), url:'', original:file.name };
    if (!match) p.files.push(fl);
    added.push(fl);
    if (CONFIG.googleClientId) DRIVE.up[fl.id] = { pct:0, state:'auth', file, pid:p.id };
    if (file.type.startsWith('video/')) {
      const v = document.createElement('video'), u = URL.createObjectURL(file);
      v.preload = 'metadata'; v.muted = true;
      v.onloadedmetadata = () => {
        const kind = (v.videoWidth ? `${v.videoWidth}×${v.videoHeight} ` : '') + (KINDS[ext] || 'Video');
        fl.detail = [kind, isFinite(v.duration) ? tc(v.duration) : '', v.videoHeight > v.videoWidth ? 'vertical 9:16' : ''].filter(Boolean).join(', '); URL.revokeObjectURL(u); save(); if (state.sheet === p.id) renderSheet();
      };
      v.onerror = () => URL.revokeObjectURL(u);
      v.src = u;
    } else if (file.type.startsWith('image/')) {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { fl.detail = `${img.naturalWidth}×${img.naturalHeight} ${KINDS[ext] || 'image'}`; URL.revokeObjectURL(u); save(); if (state.sheet === p.id) renderSheet(); };
      img.onerror = () => URL.revokeObjectURL(u);
      img.src = u;
    }
  });
  if (!added.length) return;
  log(p, `Added ${added.length} file${s(added.length)}`); save();
  if (CONFIG.googleClientId) {
    if (driveConnected()) { added.forEach(fl => uploadFile(p.id, fl.id, DRIVE.up[fl.id].file)); toast(`Uploading ${added.length} file${s(added.length)} to Google Drive. Keep this page open until it finishes.`); }
    else { renderSheet(); toast('Tap "Connect Google Drive" to start the upload.'); }
    return;
  }
  renderSheet(); toast(`Added ${added.length} file${s(added.length)}. Paste ${added.length === 1 ? 'its' : 'each one\u2019s'} Drive link so the client can download ${added.length === 1 ? 'it' : 'them'}.`);
}
function addLink(p, url, label) {
  if (!/^https?:\/\//i.test(url)) return false;
  const drive = /drive\.google\.com|docs\.google\.com/i.test(url), folder = /\/folders\//.test(url);
  if (folder && !p.folderUrl) { p.folderUrl = url; log(p, 'Added the shared folder link'); save(); renderSheet(); toast('Folder link saved. The client’s "Download all" button opens it.'); return true; }
  p.files.push({ id:uid(), name:(label && !/^https?:/i.test(label) ? label : drive ? 'Google Drive file' : 'Linked file'), size:'', detail:drive ? 'Google Drive link' : 'Download link', url });
  log(p, 'Added a file link'); save(); renderSheet(); toast('Link added. Rename the file so the client knows what it is.');
  return true;
}
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } else if (e.target.closest && e.target.closest('#sheet')) e.preventDefault(); });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('#drop');
  if (!d) { if (e.target.closest && e.target.closest('#sheet')) e.preventDefault(); return; }
  e.preventDefault(); d.classList.remove('over');
  const p = byId(d.dataset.id); if (!p) return;
  const dt = e.dataTransfer;
  if (dt.files && dt.files.length) { addFiles(p, dt.files); return; }
  const uri = (dt.getData('text/uri-list') || dt.getData('text/plain') || '').split('\n').map(x => x.trim()).find(x => x && !x.startsWith('#'));
  const label = (dt.getData('text/plain') || '').trim();
  if (!uri || !addLink(p, uri, label !== uri ? label : '')) toast('That didn’t look like a file or a link. Try dragging the file itself, or paste the link below.');
});

/* ================= actions ================= */
function toast(msg, undo = false) {
  if (undo) $('toasts').querySelectorAll('.toast [data-act="undo"]').forEach(b => b.remove());
  const el = document.createElement('div'); el.className = 'toast out';
  const t = document.createElement('span'); t.textContent = msg; el.appendChild(t);
  if (undo) { const b = document.createElement('button'); b.className = 'link'; b.dataset.act = 'undo'; b.textContent = 'Undo'; el.appendChild(b); }
  $('toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.remove('out'));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, undo ? 7000 : 3000);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? msg : 'Copying is blocked here. Select the text and copy it by hand.');
}
function go(view, tab) {
  if (tab && tab !== state.tab) state.query = '';
  state.view = view; if (tab) state.tab = tab; state.confirm = null;
  const h = view === 'client' ? 'client' : state.tab;
  try { if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h); } catch (e) {}
  window.scrollTo(0, 0); renderMain();
}
function openSheet(id) { state.sheet = id; state.confirm = null; state.showCode = false; $('sheet').scrollTop = 0; renderSheet(); }
function closeSheet() { state.sheet = null; if (state.confirm && state.confirm.startsWith('delete')) state.confirm = null; renderSheet(); }
function refresh() { save(); renderMain(); renderSheet(); }

function setStage(p, n, who = 'studio') {
  n = Math.max(1, Math.min(5, Number(n)));
  if (p.stage === n) return;
  snapshot();
  p.stage = n;
  if (n === 3) { const due = new Date(Math.max(Date.now(), +new Date(p.shootAt)) + 24 * 36e5); if (new Date(p.proofDueAt) < new Date()) p.proofDueAt = due.toISOString(); }
  if (n === 5) p.deliveredAt = new Date().toISOString();
  log(p, `Moved to ${STAGES[n - 1].label}`, who);
  toast(`${p.title} moved to ${STAGES[n - 1].label}.`, true);
}
function markPaid(p) { snapshot(); p.paid = p.total; log(p, 'Balance paid'); toast(`${p.title} marked paid. Downloads are unlocked.`, true); }
function duplicate(p) {
  snapshot();
  const c = JSON.parse(JSON.stringify(p)), now = new Date();
  let next = new Date(p.service === 'social' && p.nextShootAt ? p.nextShootAt : p.shootAt);
  if (!(p.service === 'social' && p.nextShootAt)) { if (p.service === 'social') next.setMonth(next.getMonth() + 1); else next.setDate(next.getDate() + 7); }
  while (next < now) next.setDate(next.getDate() + 7);
  Object.assign(c, { id:uid(), token:newToken(), stage:1, paid:0, approvedAt:null, deliveredAt:null, cuts:[], activeCut:null, notes:[], activity:[], reschedule:null, crew:{}, weather:'unknown', folderUrl:'', createdAt:now.toISOString(), shootAt:next.toISOString(), proofDueAt:new Date(+next + 24 * 36e5).toISOString() });
  c.airspace = SERVICES[c.service].drone ? 'pending' : 'not_needed';
  c.access = { method:p.access.method, code:/Lockbox|Smart lock/.test(p.access.method) ? '' : p.access.code, notes:p.access.notes };
  c.prep = c.prep.map(i => ({ ...i, done:false }));
  c.files = [];
  if (c.service === 'social') {
    c.reelsDelivered = 0;
    const nn = new Date(next); nn.setMonth(nn.getMonth() + 1); c.nextShootAt = nn.toISOString();
    c.title = c.title.replace(/,\s*\w+ reels$/i, '') + ', ' + next.toLocaleDateString('en-US', { month:'long' }) + ' reels';
    p.nextShootAt = null;
  }
  log(c, `Shoot booked, copied from ${p.title}`);
  projects.unshift(c);
  return c;
}

    case 'remove-file': if (DRIVE.up[x] && DRIVE.up[x].state === 'uploading') { toast('Wait for the upload to finish before removing this file.'); break; } delete DRIVE.up[x]; p.files = p.files.filter(f => f.id !== x); refresh(); break;

    case 'delete-yes': snapshot(); projects = projects.filter(k => k.id !== p.id); state.sheet = null; state.confirm = null; if (state.clientId === p.id) state.clientId = null; toast('Project deleted.', true); refresh(); break;

    case 'play': togglePlay(); break;
    case 'skip': seek(P.t + Number(x)); break;

    { const cp = clientProject(); state.confirm = null; stopPlay(); cp.approvedAt = cp.deliveredAt = new Date().toISOString(); log(cp, `Approved ${cutOf(cp).name} as the final cut`, 'client'); cp.stage = 5; save(); renderMain(); toast('Approved. Your files are being prepared.'); setTimeout(() => { const t = $('c-files'); if (t) t.scrollIntoView({ block:'start' }); }, 50); break; }

    case 'shootday': state.modal = { type:'shootday', id:p.id }; renderModal(); break;

    case 'accept-resched': { snapshot(); const r = p.reschedule; p.shootAt = r.preferred; p.proofDueAt = new Date(+new Date(r.preferred) + 24 * 36e5).toISOString(); p.reschedule = null; log(p, `Moved the shoot to ${fmtWhen(p.shootAt)}`); refresh(); toast(`Shoot moved to ${fmtWhen(p.shootAt)}. Let ${first(p.clientName)} know.`, true); state.modal = { type:'message', id:p.id }; renderModal(); break; }
